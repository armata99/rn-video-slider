name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1.10.1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      # The release notes are passed through an environment variable and a file
      # rather than interpolated into the script, so backticks and quotes in the
      # changelog cannot break or inject into the shell command.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changes }}
        run: |
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME Release" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Commit CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          branch: master
          commit_message: 'docs: update CHANGELOG.md for ${{ github.ref_name }}'
          file_pattern: CHANGELOG.md

  publish:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Guards against ever republishing the test app. The package should only
      # ever contain src/, README, LICENSE, CHANGELOG and package.json.
      - name: Verify package contents
        run: |
          npm pack --dry-run
          if npm pack --dry-run --json | grep -q '"path": *"testapp/'; then
            echo "::error::testapp files leaked into the published package"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}  # You need to create this secret in your repository settings
